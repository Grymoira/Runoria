name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python syntax
        run: python -m compileall -q algorithms benchmarks tests
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Karatsuba command line example
        run: python -m algorithms.arithmetic.karatsuba
      - name: Verify Karatsuba benchmark command line
        run: python -m benchmarks.karatsuba_vs_builtin --bits 256 --number 2 --repeat 2
      - name: Verify Floyd-Warshall command line example
        run: python -m algorithms.graph.floyd_warshall
      - name: Verify Floyd-Warshall reference benchmark command line
        run: python -m benchmarks.floyd_warshall_vs_bellman_ford --vertices 6 --density 0.5 --number 1 --repeat 2

  numba-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional benchmark dependencies
        run: python -m pip install -r requirements-dev.txt numpy numba
      - name: Verify Numba benchmark execution and output correctness
        run: |
          python -m pytest -q tests/test_numba_benchmark.py
          python -m benchmarks.bubble_sort_numba --size 200 --repeat 3
