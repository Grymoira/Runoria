name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python syntax
        run: python -m compileall -q algorithms benchmarks tests
      - name: Run tests
        run: python -m pytest -q

  numba-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional benchmark dependencies
        run: python -m pip install -r requirements-dev.txt numpy numba
      - name: Verify Numba benchmark execution and output correctness
        run: |
          python -m pytest -q tests/test_numba_benchmark.py
          python -m benchmarks.bubble_sort_numba --size 200 --repeat 3
